# Project config for verify-ui and agent pipeline
# Filled by /project-setup (audit)

name: business-ultra

appRoot: apps/web

devCommand: pnpm dev
devUrl: http://127.0.0.1:8741

checksCommand: pnpm run checks
e2eCommand: pnpm test:e2e

styleguide: docs/UI_STYLEGUIDE.md
designDir: .qa/design
acceptanceDir: .qa/acceptance
evidenceDir: .qa/evidence

# Additive project-contract paths for @audit-runner (compatible extension)
projectContract:
  architecturePath: docs/ARCHITECTURE.md
  prdPath: docs/PRD.md
  styleguidePath: docs/UI_STYLEGUIDE.md
  decisionsPath: DECISIONS.md
  securityPath: docs/SECURITY.md
  integrationsPath: docs/INTEGRATIONS.md
  operationsPath: docs/OPERATIONS.md
  migrationPath: null
  migrationActive: false
  requiredDocs:
    - AGENTS.md
    - README.md
    - docs/ARCHITECTURE.md
    - docs/PRD.md
    - docs/UI_STYLEGUIDE.md
    - .qa/project.yaml
  optionalDocs:
    - docs/SECURITY.md
    - docs/INTEGRATIONS.md
    - docs/OPERATIONS.md
    - DECISIONS.md

locale: de

adaptiveUi:
  contract: null
  profile: workstation-first

security:
  checklist: secure-by-default
  launchChecklist: recommended

typedStrict:
  languages:
    - typescript
    - python

testGate:
  profile: monorepo
  depthDefault: standard
  runner: scripts
  always:
    - typedStrict
    - secureByDefault
    - rgSecretsDiff
  never:
    - aiReview
    - explanationCheck
    - fallow
    - updateReadme
    - mutation

issueContract:
  template: global
  labels: [P0, P1, P2, needs-design]
  maxAcceptanceBullets: 5
  runtimeAxes: []
  securitySection: true
  locale: de

viewports:
  - name: mobile
    width: 390
    height: 844
  - name: desktop
    width: 1280
    height: 720

navigation:
  - Inbox
  - Marketing
  - Produkt
  - Kunden
  - Projekte
  - Einstellungen
